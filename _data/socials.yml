# Social / identity links, rendered as icons under your profile photo.
#
# ⚠️ KEY NAMES ARE NOT FREE-FORM. jekyll-socials only understands the keys in its
# own table (orcid_id, scholar_userid, semanticscholar_id, arxiv_id, dblp_url,
# github_username, linkedin_username, cv_pdf, email, …). Any OTHER key is treated
# as a "custom social" and MUST be a mapping with logo/title/url — give it a plain
# string and the build dies with:
#     undefined method `split' for nil  (jekyll-socials.rb:217)
# That is exactly what `huggingface_id: dlion168` did, so Hugging Face is defined
# as a custom social below.
#
# This file is also the human half of the identity graph. The machine half is the
# "sameAs" array built by _plugins/scholar_meta.rb, which reads this same file —
# add an ID here and it appears in the homepage JSON-LD automatically.

cv_pdf: /assets/pdf/CV_Yi-Cheng_Lin.pdf
email: f12942075@ntu.edu.tw

orcid_id: 0009-0007-3994-6433
scholar_userid: N1UuQSUAAAAJ
semanticscholar_id: 2284761645
arxiv_id: lin_y_10
github_username: dlion168
linkedin_username: yclin201220

huggingface:
  logo: https://huggingface.co/favicon.ico
  title: Hugging Face
  url: https://huggingface.co/dlion168

# ── Fill in as each profile gets cleaned up ────────────────────────────
# dblp_url: https://dblp.org/pid/XXX/XXXX.html   # after dblp@dagstuhl.de splits pid 76/4524
# openalex_id: AXXXXXXXXX                        # after the OpenAlex merge goes through
#   (openalex_id is not a jekyll-socials key — it renders no icon, but
#    _plugins/scholar_meta.rb still picks it up for sameAs. That is intentional.)

# rss_icon is omitted on purpose: you have no blog, so the feed would be empty.
# Note "rss_icon: false" does NOT hide it — the key must be absent.

